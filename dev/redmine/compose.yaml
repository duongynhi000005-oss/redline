# A throwaway Redmine for developing and testing Redline.
#
#   docker compose -f dev/redmine/compose.yaml up -d
#
# Then open http://localhost:3000 and sign in as admin / admin
# (Redmine asks you to change the password on first sign-in).
# See CONTRIBUTING.md, "Run against a test Redmine", for the rest of the setup.
#
# Data lives in the named volumes below. Remove them to start fresh:
#   docker compose -f dev/redmine/compose.yaml down -v

services:
  redmine:
    # Redline supports Redmine 6.1 and later. This runs the latest 7.x unless
    # REDMINE_VERSION says otherwise, for example REDMINE_VERSION=6.1 to check
    # the oldest supported release. CI runs both.
    image: redmine:${REDMINE_VERSION:-7}
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_DB_DATABASE: redmine
      # Development only. Never reuse this value anywhere real.
      REDMINE_SECRET_KEY_BASE: redline-dev-only-not-a-secret
    volumes:
      - redmine-files:/usr/src/redmine/files
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
      POSTGRES_DB: redmine
    volumes:
      - redmine-db:/var/lib/postgresql/data

volumes:
  redmine-files:
  redmine-db:
