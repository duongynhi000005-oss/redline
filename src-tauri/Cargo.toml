[package]
name = "redline"
description = "Redline, a Linear-style desktop client for Redmine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "redline"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "redline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
redline-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["macos-private-api"] }
tokio.workspace = true
thiserror.workspace = true
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux isn't a release target yet; the kernel keyring is enough for
# development builds.
keyring = { version = "3.6", features = ["linux-native"] }
