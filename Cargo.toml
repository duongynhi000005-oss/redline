[workspace]
members = ["src-tauri", "crates/redline-core"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/odonckers/redline"
rust-version = "1.85"

[workspace.dependencies]
redline-core = { path = "crates/redline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "gzip", "http2", "charset", "system-proxy"] }
url = { version = "2", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
