# Checks that the PR title follows Conventional Commits, because PRs are
# squash-merged and the title becomes the commit message on main.
#
# Uses pull_request_target so it also works on PRs from forks. It only reads
# the PR title through the API and never checks out or runs the PR's code.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: >
            Start the summary with a lowercase letter, for example
            "feat(ui): add command palette".
