# Builds installers when a version tag is pushed (for example v0.1.0) and
# attaches them to a draft GitHub release for a maintainer to publish.
#
# It can also be run by hand from the Actions tab: give it a version tag and
# it creates the tag on the chosen branch if it doesn't exist yet, builds the
# installers, and publishes the release when "publish" is ticked.
#
# Signing and notarization switch on by themselves once the secrets listed
# in docs/releasing.md exist. Without them the installers are unsigned:
# macOS Gatekeeper and Windows SmartScreen will warn when they're opened.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build, for example v0.1.0. Created on the chosen branch if it doesn't exist.
        required: true
      publish:
        description: Publish the release once both installers are attached (otherwise it stays a draft)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pushed tag already exists. When run by hand, create it on the
      # chosen branch so a release doesn't need anyone to push a tag.
      # Tags pushed with GITHUB_TOKEN don't start this workflow again.
      - name: Create the tag if it doesn't exist
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; building it."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version on $GITHUB_REF_NAME."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $GITHUB_SHA."

  installers:
    name: Installers (${{ matrix.name }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One app for Apple silicon and Intel Macs.
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version. Bump the version, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install dependencies
        run: npm ci

      # Only exports signing settings that are actually configured, so an
      # unsigned build doesn't trip over empty values.
      - name: Use macOS signing secrets when present
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            # Ad-hoc signing ("-") still needs no certificate, but lets
            # Gatekeeper offer Open Anyway instead of calling the app damaged.
            echo "::warning::No APPLE_CERTIFICATE secret: building an ad-hoc signed macOS app."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "UNSIGNED_NOTICE<<EOF" >> "$GITHUB_ENV"
            echo "" >> "$GITHUB_ENV"
            echo "**Unsigned builds.** Until Redline is code-signed, your system warns the first time you open it:" >> "$GITHUB_ENV"
            echo "" >> "$GITHUB_ENV"
            echo "- **macOS:** open the .dmg and drag Redline to Applications. The first time, right-click Redline in Applications and choose Open, then Open again. If macOS only offers Move to Trash, go to System Settings > Privacy & Security and click Open Anyway. If it says Redline is damaged, run \`xattr -cr /Applications/Redline.app\` in Terminal and open it again." >> "$GITHUB_ENV"
            echo "- **Windows:** run the installer. If SmartScreen says \"Windows protected your PC\", click More info, then Run anyway." >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::Signing without notarization: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID to notarize."
          fi

      - name: Use the Windows signing certificate when present
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          if ($env:WINDOWS_SIGN_COMMAND) {
            # Cloud HSM / Azure Trusted Signing custom signCommand support
            $config = @{ bundle = @{ windows = @{
              signCommand = $env:WINDOWS_SIGN_COMMAND
            } } } | ConvertTo-Json -Depth 5
            Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
            "TAURI_EXTRA_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::No WINDOWS_CERTIFICATE secret: building unsigned Windows installers."
            "UNSIGNED_NOTICE<<EOF`n`n**Unsigned builds.** Until Redline is code-signed, your system warns the first time you open it:`n`n- **macOS:** open the .dmg and drag Redline to Applications. The first time, right-click Redline in Applications and choose Open, then Open again. If macOS only offers Move to Trash, go to System Settings > Privacy & Security and click Open Anyway. If it says Redline is damaged, run ``xattr -cr /Applications/Redline.app`` in Terminal and open it again.`n- **Windows:** run the installer. If SmartScreen says `"Windows protected your PC`", click More info, then Run anyway.`nEOF" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "redline.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          # Tauri signs with signtool when the config names a certificate.
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.conf.json -Value $config
          "TAURI_EXTRA_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Redline ${{ env.TAG }}
          releaseBody: |
            See the assets below for the macOS (.dmg) and Windows (.msi and setup .exe) installers.

            Redline needs Redmine 6.1 or later with the REST API turned on, and your own API key (My account > API access key).${{ env.UNSIGNED_NOTICE }}
          releaseDraft: true
          # 0.x releases and tags with a hyphen (v0.2.0-beta.1) are pre-releases.
          prerelease: ${{ contains(env.TAG, '-') || startsWith(env.TAG, 'v0.') }}
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

  publish:
    name: Publish
    needs: installers
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
