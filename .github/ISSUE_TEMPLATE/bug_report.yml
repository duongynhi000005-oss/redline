name: Bug report
description: Something in Redline doesn't work as it should.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't paste API keys, server URLs you
        don't want public, or other people's issue data. Security problems go
        through the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: redline-version
    attributes:
      label: Redline version
      description: Shown in the About window.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 26.1, Windows 11 24H2
  - type: input
    id: redmine-version
    attributes:
      label: Redmine version
      description: Shown under Administration > Information, or ask your Redmine admin. Redline supports 6.1 and later.
      placeholder: e.g. 7.0.3
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any API keys or private data first.
      render: text
